<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: data:">
<title>Pip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- chat panel -->
<section id="panel" class="hit hidden">
  <header id="head">
    <div class="who"><b>Pip</b> <span id="modelTag">gemini</span></div>
    <div class="headBtns">
      <button id="btnSettings" title="Settings">&#9881;</button>
      <button id="btnMin" title="Minimize - keep the chat, show only the character">&#8212;</button>
      <button id="btnExpand" title="Expand / restore (or double-click the title bar)">&#10530;</button>
      <button id="btnClose" title="Close (Ctrl+Alt+Space)">&#10005;</button>
    </div>
  </header>
  <div id="grip" title="Drag to resize the chat"></div>

  <div id="chips">
    <button id="btnSkills" class="primaryChip" title="All office skills">&#129520; Skills</button>
    <button id="btnClip" class="ai" title="Fix / translate / summarize what you copied (Ctrl+Alt+C)">&#128203; Clipboard</button>
    <button class="ai" data-skill="email" title="Write an email">&#9993;&#65039; Email</button>
    <button class="ai" data-skill="translate" title="Translate English / Burmese">&#127760; Translate</button>
    <button id="btnExcel" class="ai" title="Read the open Excel workbook (or pick a file) and chart it">&#128202; Excel chart</button>
    <button id="btnReport" class="ai" title="AI writes your end-of-day report">&#10024; Daily report</button>
    <button id="btnSummarize" class="ai" title="Summarize a file">&#128218; Summarize</button>
    <button class="ai" data-skill="focus" id="btnFocus" title="25-minute focus timer with break reminder">&#127813; Focus</button>
  </div>

  <!-- skills sheet: filled by skills.js, PC tasks below are static -->
  <div id="skills" class="hidden">
    <div class="sheetHead"><h3>Skills</h3><button id="skillsClose" title="Close">&#10005;</button></div>
    <div id="skillGroups"></div>
    <div class="skillGroup">
      <h4>&#128187; PC tasks</h4>
      <div class="skillGrid">
        <button data-task="Organize" title="Sort Downloads into folders">&#128194; Tidy Downloads</button>
        <button data-task="Backup" title="Zip Documents + Desktop">&#128190; Backup</button>
        <button data-task="ToPdf" data-folder="1" title="Convert a folder of Office files to PDF">&#128196; Folder to PDF</button>
        <button data-task="Duplicates" data-folder="1" title="Find duplicate files">&#128269; Find duplicates</button>
        <button data-task="CleanTemp" title="Delete temp files older than 7 days">&#129529; Clean temp</button>
        <button data-task="DailyNote" title="Open today's to-do note">&#128221; Today's note</button>
        <button data-task="Morning" title="Open your morning apps and sites">&#9728;&#65039; Morning start</button>
      </div>
    </div>
  </div>

  <div id="log"></div>

  <div id="skillChip" class="hidden"><span id="skillChipName"></span><button id="skillChipX" title="Cancel skill">&#10005;</button></div>
  <div id="attach" class="hidden"><span id="attachName"></span><button id="attachX">&#10005;</button></div>
  <form id="form">
    <button type="button" id="btnFile" title="Attach a file">&#128206;</button>
    <textarea id="input" rows="1" placeholder="Ask Pip anything...  (Enter = send)"></textarea>
    <button type="button" id="btnMic" title="Push to talk (Ctrl+Alt+V)">&#127908;</button>
    <button type="submit" id="btnSend" title="Send">&#10148;</button>
  </form>
  <div id="foot">AI can make mistakes &middot; drop a file on Pip to summarize</div>

  <!-- settings sheet -->
  <div id="settings" class="hidden">
    <h3>Settings</h3>

    <div class="secHead"><b>AI providers</b><button id="pAdd" type="button">+ Add</button></div>
    <div id="pList"></div>
    <div id="pAddMenu" class="hidden"></div>
    <label class="row"><input id="sFallback" type="checkbox"> If one provider fails, try the next one automatically</label>

    <!-- provider editor -->
    <div id="pEdit" class="hidden">
      <div class="secHead"><b id="pEditTitle">Provider</b><a id="pKeyLink" href="#">get a key</a></div>
      <div id="pNote" class="pNote"></div>
      <label>Name <input id="pName"></label>
      <label class="pGemini">Connection
        <select id="pMode">
          <option value="relay">Relay (works in Myanmar, no VPN)</option>
          <option value="direct">Direct to Google (VPN or proxy)</option>
        </select>
      </label>
      <label class="pGemini pRelay">Relay URL <input id="pRelay"></label>
      <label class="pOpenAI">API base URL <input id="pBase" placeholder="https://.../v1"></label>
      <label>Model
        <div class="inline"><input id="pModel" list="pModelList" placeholder="model name"><button id="pLoadModels" type="button">Load models</button></div>
        <datalist id="pModelList"></datalist>
      </label>
      <label class="pKeyRow">API key(s)
        <textarea id="pKey" rows="2" spellcheck="false" placeholder="paste key - one per line to add several"></textarea>
      </label>
      <div id="pStatus"></div>
      <div class="keyBtns">
        <button id="pTest" type="button">Test</button>
        <button id="pShow" type="button" class="pKeyRow">Show</button>
        <button id="pClearKeys" type="button" class="pKeyRow">Remove keys</button>
      </div>
      <div class="btnRow"><button id="pCancel" type="button">Cancel</button><button id="pSave" type="button" class="primary">Save provider</button></div>
    </div>

    <label>Proxy (optional, for blocked services) <input id="sProxy" placeholder="e.g. http://127.0.0.1:8118 - leave empty for none"></label>
    <hr class="sep">
    <label>Character
      <select id="sChar">
        <option value="pip">Pip (office buddy)</option>
        <option value="bears">Mocha &amp; Milk (bear couple)</option>
        <option value="cat">Mango (orange cat)</option>
        <option value="dog">Kopi (puppy)</option>
        <option value="capy">Capy (chill capybara)</option>
        <option value="penguin">Pebble (penguin)</option>
      </select>
    </label>
    <div id="lookBox" class="hidden">
      <div class="secHead"><b>&#127912; Look</b><button id="lookReset" type="button" class="ghost">Reset look</button></div>
      <div id="lookColors" class="lookGrid"></div>
      <label id="hairRow" class="hidden">Hair style <select id="lookHair"></select></label>
      <label>Eyes <select id="lookEyes"></select></label>
      <label>Accessory <div class="inline"><select id="lookAcc"></select><input id="lookAccColor" type="color" title="Accessory colour"></div></label>
    </div>
    <label class="row"><input id="sSound" type="checkbox"> Character sounds (meow, woof, honk...)</label>
    <label>Sound volume
      <div class="inline"><input id="sVolume" type="range" min="0" max="1" step="0.05"><button id="sSoundTest" type="button">&#128264; Play</button></div>
    </label>
    <label>Reply language
      <select id="sLang"><option value="auto">Same as I write</option><option value="en">English</option><option value="my">Burmese</option></select>
    </label>
    <label>Your name <input id="sName" placeholder="optional, for reports"></label>
    <div class="secHead"><b>&#128100; About me</b><span class="pNote">the AI reads this before every answer</span></div>
    <textarea id="sAbout" rows="6" spellcheck="false" placeholder="Tell the AI about you, e.g.
- I work at ... as ... (department, what I do every day)
- My boss / team: ...   My customers: ...
- I write emails in English to clients, Burmese to my team
- I like short answers with bullet points
- My email signature: ..."></textarea>
    <div class="secHead"><b>&#129504; Things I remember</b><button id="sForget" type="button" class="ghost">Forget everything</button></div>
    <div id="memList" class="pNote"></div>
    <label class="row"><input id="sSpeak" type="checkbox"> Read replies aloud</label>
    <label class="row"><input id="sNatural" type="checkbox"> Natural voice, speaks Burmese too (online, Microsoft)</label>
    <div id="naturalNote" class="pNote"></div>
    <label class="row"><input id="sAuto" type="checkbox"> Start when Windows starts</label>
    <div id="updBox" class="hidden">
      <div class="secHead"><b>&#11014; Updates</b><button id="updCheck" type="button" class="ghost">Check now</button></div>
      <div id="updInfo" class="pNote"></div>
      <label class="row"><input id="sAutoUpd" type="checkbox"> Install updates automatically</label>
    </div>
    <label>Voice <select id="sVoice"></select></label>
    <label>Voice language (what you speak)
      <select id="sVoiceLang"><option value="auto">Auto (Burmese or English)</option><option value="my">Burmese (မြန်မာ)</option><option value="en">English</option></select>
    </label>
    <label>Microphone
      <div class="inline"><select id="sMic"></select><button id="sMicTest" type="button">Test mic</button></div>
    </label>
    <div id="micLevel" class="pNote"></div>
    <div class="btnRow"><button id="sCancel" type="button">Cancel</button><button id="sSave" type="button" class="primary">Save</button></div>
  </div>
</section>

<!-- speech hint bubble when panel is closed -->
<div id="hint" class="hit hidden"></div>
